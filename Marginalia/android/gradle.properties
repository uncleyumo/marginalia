org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Pin the JVM for the BUILD, here, rather than relying on whatever JAVA_HOME a
# shell happens to carry.
#
# Gradle 9 refuses to start on anything below 17 ("Gradle requires JVM 17 or
# later to run"). A JDK 8 JAVA_HOME leaks in easily here because `avdmanager`
# still needs 8 — it crashes with `NoClassDefFoundError: javax/xml/bind` on 11+
# since JAXB was removed from the JDK. So the two tools disagree about which JDK
# they want, and a global JAVA_HOME can only satisfy one of them.
#
# Setting it per-project settles it: the build always uses 21 regardless of the
# shell, and avdmanager keeps working by being given JAVA_HOME=8 on its own
# command line (see run-emulator.bat).
#
# NOTE: this line is the one machine-specific value in a tracked file. Gradle
# reads it from HERE and nowhere else — it does not look at local.properties,
# and JAVA_HOME is not a substitute because avdmanager needs 8 in the same
# shell. If you fork this, point it at your own JDK 21.
org.gradle.java.home=E:\\Dev_work\\Java_Dev\\JDK_SRC\\JDK_21

# Parallel builds and the build cache: both are correct for a clean first build.
org.gradle.parallel=true
org.gradle.caching=true

# The Kotlin incremental caches are what broke on the first real run
# ("Could not close incremental caches ... class-fq-name-to-source.tab"), after
# the build was switched from a JDK 8 run to a JDK 21 one and left 4 KB truncated
# cache files behind. Turning incremental compilation off makes each build
# recompile the plugin modules from source, which costs a little time and cannot
# fail that way.
#
# This is a deliberate trade, not a workaround: the app has six plugins and no
# large Kotlin sources, so the time saved by incrementality is small, while a
# corrupt cache that only clears by hand is expensive. Remove this line once a
# build has completed cleanly on this machine.
kotlin.incremental=false


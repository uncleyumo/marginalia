distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# Tencent Cloud mirror rather than services.gradle.org.
#
# The build failed with `SSLHandshakeException: PKIX path building failed`
# while the wrapper was downloading ITSELF: the JVM could not validate the
# certificate chain to services.gradle.org. That is a trust-store problem, not a
# network problem — the host is reachable and answers 200.
#
# A mirror sidesteps the question entirely. Measured on this machine:
#   services.gradle.org         1.22 s
#   mirrors.cloud.tencent.com   0.21 s
# Same file, same bytes; only the host differs. On a network outside China, put
# services.gradle.org back.
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.1.0-all.zip